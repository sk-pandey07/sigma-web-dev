<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 2</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Job Application</legend>
            <label for="name">UserName:</label>
            <input type="text" name="" id="name"> <br>

            <label for="email">Email ID:</label>
            <input type="email" name="" id="email">
            <br>

            <label for="phone">Contect Number:</label>
            <input type="number" name="" id="phone">
            <br>

            <label for="fileupload">Resume</label>
            <input type="file" name="fileupload" id="fileupload"> <br>

            <label for="experience">Experience(year):</label>
            <input type="number" name="" id="experience" min="0" max="50"> <br>

            <fieldset>
                <legend>Skills</legend>

                <label for="html">HTML</label>
                <input type="checkbox" id html> <br>
                <label for="CSS">CSS</label>
                <input type="checkbox" name="" id="CSS"> <br>

                <label for="JAVASCRIPT">JAVASCRIPT</label>
                <input type="checkbox" id="JAVASCRIPT">
            </fieldset> <br>

            <label for="Highest education">Highest education:</label>
            <select name="education" id="Highest education">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
            </select> <br>

            <fieldset>
    <legend>Availability</legend>

    <label for="radio1">Full Time</label>
    <input type="radio" name="availability" id="radio1" value="fulltime">
    <br>

    <label for="radio2">Part Time</label>
    <input type="radio" name="availability" id="radio2" value="parttime"> <br>

    <label for="comments">Addition Comments</label>
    <textarea name="teaxtarea" id="comments" rows="3" cols="40">write here...</textarea> <br>
    <button type="submit">submit</button>
</fieldset>

    </form>
</body>
</html>
