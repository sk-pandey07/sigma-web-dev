<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="1">
        <thead>
            <th>student-Id</th>
            <th>student-name</th>
            <th>Gender</th>
            <th>Age</th>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>tony</td>
                <td rowspan="2">male</td>
                <td rowspan="3">21</td>
            </tr>
            <tr>
                <td>102</td>
                <td>sam</td>
            </tr>
            <tr>
                <td>103</td>
                <td>jerry</td>
                <td>female</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
