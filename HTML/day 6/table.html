<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Monday</td>
                <td rowspan="2">8:00AM</td>
                <td rowspan="2">5:00PM</td>
                <td>introduction to XML</td>
            </tr>
            <tr>
                <td>Velidity DDT and Relax NG</td>
            </tr>
            <tr>
                <td rowspan="3">Tuesday</td>
                <td>8:00AM</td>
                <td>11:00AM</td>
                <td rowspan="2">XPath</td>
            </tr>
            <tr>
                <td>11:00AM</td>
                <td>2:00PM</td>
            </tr>
            <tr>
                <td>2:00PM</td>
                <td>5:00PM</td>
                <td>XLS Transformations</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>8:00AM</td>
                <td>12:00PM</td>
                <td>XSL Formating</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
