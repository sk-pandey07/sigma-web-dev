<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position-properties</title>
    <style>
        .container{
            border: solid black 1px;
        }
        img{
            padding: 10px;
        }
        .img2{
            position: absolute;
            top: 100px;
        }
        .container{
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Screenshot 2025-12-21 171736.png" alt="" height="150px" width="100px" class="img1">

        <img src="Screenshot 2025-12-21 171736.png" alt="" height="150px" width="100px" class="img2">

        <img src="Screenshot 2025-12-21 171736.png" alt="" height="150px" width="100px" class="img3">

        <img src="Screenshot 2025-12-21 171736.png" alt="" height="150px" width="100px" class="img4">
    </div>
</body>
</html>
