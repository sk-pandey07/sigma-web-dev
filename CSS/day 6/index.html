<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <style>
        .photo{
            float: left;
            height:100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <img src="https://tse3.mm.bing.net/th/id/OIP.TXjQ07doA1Vn8tZ88XOtOAHaHa?r=0&pid=Api&h=220&P=0" alt="" class="photo">
    <p>
        This is some text. The text will move around the image
        because the image is floated to the left.
    </p>
</body>
</html>
