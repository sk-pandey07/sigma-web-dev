<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display-properties</title>
    <style>
        div{
            border: solid red 2px;
            height: 300px;width: 300px;
            margin: 25px;
            padding: 20px;
        }
        .Box1{
            border: solid blue 2px;
            margin: 30px;
            padding: 20px;
            height: 300px;
            width: 200px;
            display: block;
        }
        .box2{
            border: solid palevioletred 2px;
            margin: 30px;
            padding: 20px;
            height: 400px;
            width: 300px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div>hey i am shashi</div>
    <div>hey i am shashi 1</div>
    <span class="Box1">hello</span>
    <span class="Box1">hellooooo</span>
    <span class="box2">i am bca student</span>
</body>
</html>
